<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Photo Calendar</title>
    <style>
        /* --- 動的テーマ用の変数定義 --- */
        :root {
            --bg-color: #0d0d0d;
            --text-color: #e6e6e6;
            --font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;

            --card-bg: color-mix(in srgb, var(--bg-color) 94%, var(--text-color));
            --tile-bg: color-mix(in srgb, var(--bg-color) 88%, var(--text-color));
            --border-color: color-mix(in srgb, var(--bg-color) 70%, var(--text-color));
            --border-active: color-mix(in srgb, var(--bg-color) 40%, var(--text-color));
            --day-num-color: color-mix(in srgb, var(--bg-color) 50%, var(--text-color));
        }

        * {
            -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            outline: none !important;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background-color: var(--bg-color);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* 1. 月カードの縦スクロールコンテナ */
        .month-scroll-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            scroll-snap-type: y proximity; 
            padding: 0;
            -webkit-overflow-scrolling: touch;
            z-index: 5;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
            scroll-behavior: smooth;
        }
        .month-scroll-container::-webkit-scrollbar {
            display: none;
        }

        body.calendar-open .month-scroll-container {
            transform: scale(0.95);
            opacity: 0;
            pointer-events: none;
        }

        .scroll-spacer {
            min-height: calc(50vh - 100px);
            flex-shrink: 0;
        }

        .month-card {
            width: 320px;
            height: 180px;
            background-color: var(--card-bg);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            scroll-snap-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            
            opacity: 0.25;
            transform: scale(0.85);
            z-index: 1;
            
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.3s ease, border 0.3s;
            cursor: pointer;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            margin: 10px 0;
        }

        .month-card.active {
            opacity: 1 !important;
            transform: scale(1) translateY(0) !important;
            z-index: 10 !important;
            border: 1px solid var(--border-active);
        }
        
        .month-card .card-title {
            position: absolute;
            bottom: 8px;
            left: 12px;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: var(--text-color);
            z-index: 4;
            text-shadow: 0 2px 8px var(--bg-color);
            transition: opacity 0.3s ease, text-shadow 0.3s ease;
        }

        body.calendar-open .month-card:not(.active) {
            opacity: 0.1 !important;
        }
        body.calendar-open .month-card:not(.active) .card-title {
            opacity: 0.2;
            text-shadow: none;
        }

        .card-slideshow-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }
        
        .card-slideshow-img.fade-in {
            opacity: 0.75; 
        }

        .month-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, var(--bg-color) 0%, transparent 70%);
            z-index: 2;
        }

        /* 2. カレンダーエリア */
        .calendar-container {
            width: 100%;
            position: absolute;
            top: 0;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
            transform: translateX(20px);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 5;
            display: flex;
            align-items: center;
        }

        body.calendar-open .calendar-container {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        /* 左上のカレンダーヘッダー（月表示と戻るボタン） */
        .calendar-header {
            position: absolute;
            top: 40px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }

        .calendar-month-text {
            font-size: 2.4rem;
            font-weight: 200;
            color: var(--text-color);
            letter-spacing: 0.1em;
            line-height: 1;
            opacity: 0.9;
        }

        /* ★ボタン類の共通スタイル（囲み枠ありのデザインに統一） */
        .theme-select-btn, .toggle-view-btn, .settings-btn, 
        .back-to-months-btn, .gallery-close-btn, .lightbox-close-btn {
            color: var(--text-color);
            opacity: 0.7;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            background-color: var(--bg-color);
            text-shadow: none;
            transition: opacity 0.3s, background-color 0.2s;
        }

        .theme-select-btn {
            position: absolute;
            top: 40px;
            left: 20px;
            z-index: 20;
            border-radius: 6px;
        }
        body.calendar-open .theme-select-btn {
            opacity: 0;
            pointer-events: none;
        }

        .toggle-view-btn { position: absolute; bottom: 40px; right: 20px; z-index: 10; }
        .settings-btn { position: absolute; bottom: 40px; left: 20px; z-index: 10; }
        .gallery-close-btn { position: absolute; top: 40px; left: 20px; z-index: 25; }
        .lightbox-close-btn { position: absolute; top: 40px; left: 20px; z-index: 105; }

        .calendar-scroll-wrapper {
            width: 100%;
            display: flex;
            overflow-x: hidden;
            align-items: center; 
        }
        .calendar-scroll-wrapper::-webkit-scrollbar {
            display: none;
        }

        /* ★変更: スマホで左に寄らないようにする修正 */
        .calendar-grid {
            display: grid !important;
            grid-template-columns: repeat(7, 1fr) !important;
            gap: 2px !important; 
            width: calc(100vw - 20px) !important;
            max-width: 362px !important;
            background-color: transparent; 
            margin: 0 10px !important; /* 小さいスマホ用の左右の余白 */
            scroll-snap-align: center;
            flex-shrink: 0;
        }

        /* 画面幅に余裕がある場合は中央に配置 */
        @media (min-width: 382px) {
            .calendar-grid {
                margin: 0 calc((100vw - 362px) / 2) !important;
            }
        }

        .day-tile {
            position: relative;
            width: 100% !important;   
            height: auto !important;  
            aspect-ratio: 1 / 1; 
            background-color: var(--tile-bg); 
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            box-sizing: border-box !important;
        }

        .day-tile.has-image {
            border: 1px solid var(--border-active);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
        }

        .day-tile:nth-child(7n) {
            margin-right: 0px !important;
        }

        .day-tile.blank-tile {
            cursor: default;
            background-color: transparent;
            border: none;
            box-shadow: none; 
        }

        .day-number {
            font-size: 1.4rem;
            font-weight: 200;
            color: var(--day-num-color);
            z-index: 2;
            pointer-events: none;
            line-height: 1;
            margin-top: 2px;
        }

        .day-tile.has-image .day-number {
            display: none !important;
        }

        .day-tile img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            animation: fadeIn 0.4s ease;
        }

        /* 3. ギャラリービュー */
        .gallery-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            z-index: 20;
            display: none;
            padding-top: 90px; /* ボタンと被らないように余白を少し拡大 */
            box-sizing: border-box;
            overflow-y: auto;
        }

        .gallery-grid {
            display: grid;
            gap: 1px; 
            background-color: var(--border-active); 
            width: 100%;
        }

        .gallery-tile {
            aspect-ratio: 1 / 1;
            background-color: var(--card-bg);
            border-radius: 0; 
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .gallery-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 4. 特大写真表示（ライトボックス） */
        .lightbox-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background-color: color-mix(in srgb, var(--bg-color) 95%, transparent);
            z-index: 100;
            display: none; 
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            touch-action: none;
        }

        .lightbox-overlay.open {
            display: flex;
            opacity: 1;
        }

        .lightbox-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox-content-wrapper {
            position: relative;
            display: inline-block;
        }

        .lightbox-img {
            max-width: 362px; 
            max-height: calc(100vh - 80px);
            display: block;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .lightbox-date {
            position: absolute;
            bottom: -25px;
            right: 0;
            color: var(--text-color);
            opacity: 0.6;
            font-size: 1rem;
            letter-spacing: 0.1em;
            font-weight: 200;
            pointer-events: none;
            text-shadow: 0 1px 3px var(--bg-color);
        }

        /* 5. モーダル共通デザイン（設定＆テーマ切り替え） */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); z-index: 200; display: none;
            justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.open { display: flex; opacity: 1; }
        .modal-box {
            background-color: var(--card-bg); padding: 30px; border-radius: 12px;
            border: 1px solid var(--border-color); color: var(--text-color);
            display: flex; flex-direction: column; gap: 20px; min-width: 250px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); max-height: 80vh;
        }
        .modal-box h3 { 
            margin: 0; font-weight: 300; letter-spacing: 0.1em; 
            border-bottom: 1px solid var(--border-color); padding-bottom: 10px;
        }
        
        .settings-label { 
            display: flex; justify-content: space-between; align-items: center; 
            font-size: 0.9rem; letter-spacing: 0.05em;
        }
        .modal-box input[type="color"] { 
            background: none; border: none; cursor: pointer; width: 35px; height: 35px; 
            padding: 0; border-radius: 4px; overflow: hidden;
        }
        .modal-box select {
            background-color: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color);
            padding: 8px; border-radius: 4px; font-family: inherit; outline: none; cursor: pointer;
        }
        .modal-box button {
            background-color: transparent; color: var(--text-color); border: 1px solid var(--border-active);
            padding: 12px; border-radius: 6px; cursor: pointer; margin-top: 10px; font-family: inherit; letter-spacing: 0.1em;
            transition: background-color 0.2s;
        }
        .modal-box button:hover { background-color: var(--border-color); }

        .theme-list {
            list-style: none; padding: 0; margin: 0; 
            max-height: 250px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 6px;
        }
        .theme-item {
            padding: 12px 15px; cursor: pointer; transition: background 0.2s;
            font-size: 0.9rem; letter-spacing: 0.1em;
            border-bottom: 1px solid var(--border-color);
        }
        .theme-item:last-child { border-bottom: none; }
        .theme-item.active { background-color: var(--text-color); color: var(--bg-color); font-weight: bold; }
        .theme-item:hover:not(.active) { background-color: var(--border-active); }

        #file-input { display: none; }
    </style>
</head>
<body>

    <div class="month-scroll-container" id="scroll-container">
        <div class="scroll-spacer"></div>
        <div class="scroll-spacer"></div>
    </div>

    <div class="theme-select-btn" id="theme-select-btn">THEME: <span id="current-theme-name">Main</span> ▾</div>

    <div class="calendar-container" id="calendar-area">
        <div class="calendar-header">
            <div class="back-to-months-btn" id="back-to-months-btn">← BACK</div>
            <div class="calendar-month-text" id="calendar-month-text"></div>
        </div>

        <div class="settings-btn" id="settings-btn">SETTINGS</div>
        <div class="toggle-view-btn" id="toggle-view-btn">GALLERY</div>
        <div class="calendar-scroll-wrapper" id="calendar-wrapper">
            <main class="calendar-grid" id="calendar-prev"></main>
            <main class="calendar-grid" id="calendar-current"></main>
            <main class="calendar-grid" id="calendar-next"></main>
        </div>
    </div>

    <div class="gallery-container" id="gallery-container">
        <div class="gallery-close-btn" id="gallery-close-btn">← BACK</div>
        <div class="gallery-grid" id="gallery-grid"></div>
    </div>

    <div class="lightbox-overlay" id="lightbox">
        <div class="lightbox-close-btn" id="lightbox-close-btn">← BACK</div>
        <div class="lightbox-container" id="lightbox-container">
            <div class="lightbox-content-wrapper">
                <img class="lightbox-img" id="lightbox-image" src="" alt="拡大表示">
                <div class="lightbox-date" id="lightbox-date"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="theme-overlay">
        <div class="modal-box">
            <h3>ACCOUNTS / THEMES</h3>
            <ul class="theme-list" id="theme-list"></ul>
            <button id="add-theme-btn">＋ NEW THEME</button>
            <button id="theme-close-btn">CLOSE</button>
        </div>
    </div>

    <div class="modal-overlay" id="settings-overlay">
        <div class="modal-box">
            <h3>DESIGN</h3>
            <label class="settings-label">背景色
                <input type="color" id="bg-color-picker" value="#0d0d0d">
            </label>
            <label class="settings-label">文字色
                <input type="color" id="text-color-picker" value="#e6e6e6">
            </label>
            <label class="settings-label">フォント
                <select id="font-select">
                    <option value="sans-serif">ゴシック体</option>
                    <option value="serif">明朝体</option>
                    <option value="rounded">丸ゴシック</option>
                    <option value="monospace">等幅フォント</option>
                </select>
            </label>
            <button id="settings-close-btn">OK</button>
        </div>
    </div>

    <input type="file" id="file-input" accept="image/*">

    <script>
        // --- データ管理（テーマ・アカウント） ---
        let currentThemeId = localStorage.getItem('photo_calendar_current_theme') || 'default';
        let themes = JSON.parse(localStorage.getItem('photo_calendar_themes')) || [{id: 'default', name: 'Main'}];

        function getStorageKey(year, month) {
            const m = String(month).padStart(2, '0');
            return currentThemeId === 'default' ? `photo_calendar_${year}_${m}` : `photo_calendar_${currentThemeId}_${year}_${m}`;
        }

        // --- デザイン設定（色・フォント）の管理 ---
        const rootVars = document.documentElement.style;
        const bgPicker = document.getElementById('bg-color-picker');
        const textPicker = document.getElementById('text-color-picker');
        const fontSelect = document.getElementById('font-select');
        
        const fontsMap = {
            'sans-serif': '-apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, sans-serif',
            'serif': '"Noto Serif JP", "Yu Mincho", "MS Mincho", serif',
            'rounded': '"Hiragino Maru Gothic ProN", "Yu Rounded", "Arial Rounded MT Bold", sans-serif',
            'monospace': 'ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace'
        };

        function loadThemeDesign() {
            const saved = JSON.parse(localStorage.getItem('photo_calendar_design')) || {};
            if (saved.bgColor) { rootVars.setProperty('--bg-color', saved.bgColor); bgPicker.value = saved.bgColor; }
            if (saved.textColor) { rootVars.setProperty('--text-color', saved.textColor); textPicker.value = saved.textColor; }
            if (saved.fontKey && fontsMap[saved.fontKey]) { 
                rootVars.setProperty('--font-family', fontsMap[saved.fontKey]); 
                fontSelect.value = saved.fontKey; 
            }
        }

        function saveThemeDesign() {
            localStorage.setItem('photo_calendar_design', JSON.stringify({
                bgColor: bgPicker.value,
                textColor: textPicker.value,
                fontKey: fontSelect.value
            }));
        }

        function getBrightness(hex) {
            let h = hex.replace('#', '');
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return (r * 299 + g * 587 + b * 114) / 1000;
        }

        bgPicker.addEventListener('input', (e) => { 
            const newBg = e.target.value;
            const currentText = textPicker.value;

            rootVars.setProperty('--bg-color', newBg); 
            
            const bgBrightness = getBrightness(newBg);
            const textBrightness = getBrightness(currentText);
            const brightnessDiff = Math.abs(bgBrightness - textBrightness);

            if (brightnessDiff < 125) {
                const autoTextColor = bgBrightness > 128 ? '#111111' : '#eeeeee';
                rootVars.setProperty('--text-color', autoTextColor);
                textPicker.value = autoTextColor;
            } else {
                rootVars.setProperty('--text-color', currentText);
            }
            saveThemeDesign(); 
        });

        textPicker.addEventListener('input', (e) => { 
            rootVars.setProperty('--text-color', e.target.value); 
            saveThemeDesign(); 
        });
        
        fontSelect.addEventListener('change', (e) => { 
            rootVars.setProperty('--font-family', fontsMap[e.target.value]); 
            saveThemeDesign(); 
        });

        const settingsOverlay = document.getElementById('settings-overlay');
        document.getElementById('settings-btn').onclick = (e) => {
            e.stopPropagation();
            settingsOverlay.style.display = 'flex';
            setTimeout(() => settingsOverlay.classList.add('open'), 10);
        };
        document.getElementById('settings-close-btn').onclick = () => {
            settingsOverlay.classList.remove('open');
            setTimeout(() => settingsOverlay.style.display = 'none', 300);
        };

        // --- テーマ切り替えUIの管理 ---
        const themeOverlay = document.getElementById('theme-overlay');
        const themeList = document.getElementById('theme-list');
        const currentThemeNameSpan = document.getElementById('current-theme-name');

        function renderThemeList() {
            themeList.innerHTML = '';
            themes.forEach(t => {
                const li = document.createElement('li');
                li.className = 'theme-item' + (t.id === currentThemeId ? ' active' : '');
                li.textContent = t.name;
                li.onclick = () => {
                    switchTheme(t.id);
                    themeOverlay.classList.remove('open');
                    setTimeout(() => themeOverlay.style.display = 'none', 300);
                };
                themeList.appendChild(li);
            });
            const currentTheme = themes.find(t => t.id === currentThemeId) || themes[0];
            currentThemeNameSpan.textContent = currentTheme.name;
        }

        document.getElementById('theme-select-btn').onclick = () => {
            renderThemeList();
            themeOverlay.style.display = 'flex';
            setTimeout(() => themeOverlay.classList.add('open'), 10);
        };

        document.getElementById('theme-close-btn').onclick = () => {
            themeOverlay.classList.remove('open');
            setTimeout(() => themeOverlay.style.display = 'none', 300);
        };

        document.getElementById('add-theme-btn').onclick = () => {
            const name = prompt('テーマ名を入力してください (例: 鉄塔, 廃墟, 日常 など)');
            if (name) {
                const id = 'theme_' + Date.now();
                themes.push({id, name});
                localStorage.setItem('photo_calendar_themes', JSON.stringify(themes));
                switchTheme(id);
            }
        };

        function switchTheme(id) {
            currentThemeId = id;
            localStorage.setItem('photo_calendar_current_theme', currentThemeId);
            renderThemeList();
            
            cardObjects.forEach(obj => {
                if(obj.intervalId) clearInterval(obj.intervalId);
                obj.element.remove();
            });
            cardObjects = [];
            createMonthCards();
            updateAllSlideshows();
            
            if (document.body.classList.contains('calendar-open')) {
                updateAllCalendarGrids();
                calendarMonthText.textContent = `${currentYear} . ${String(currentMonth).padStart(2, '0')}`;
            }
        }


        // --- コア要素の取得と変数 ---
        const scrollContainer = document.getElementById('scroll-container');
        const calendarWrapper = document.getElementById('calendar-wrapper');
        const calendarArea = document.getElementById('calendar-area');
        const galleryContainer = document.getElementById('gallery-container');
        const galleryGrid = document.getElementById('gallery-grid');
        const galleryCloseBtn = document.getElementById('gallery-close-btn');
        const toggleViewBtn = document.getElementById('toggle-view-btn');
        const backToMonthsBtn = document.getElementById('back-to-months-btn'); 
        const calendarMonthText = document.getElementById('calendar-month-text');
        const fileInput = document.getElementById('file-input');
        
        const calPrev = document.getElementById('calendar-prev');
        const calCurrent = document.getElementById('calendar-current');
        const calNext = document.getElementById('calendar-next');

        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightbox-image');
        const lightboxDate = document.getElementById('lightbox-date');
        const lightboxContainerDOM = document.getElementById('lightbox-container');
        const lightboxCloseBtn = document.getElementById('lightbox-close-btn');
        
        let currentYear = 2026;
        let currentMonth = 5;
        let currentSelectedTile = null;
        let cardObjects = [];
        let isSyncingScroll = false;

        let activeMonthPhotos = [];
        let currentPhotoIndex = -1;
        let touchStartX = 0;
        let touchEndX = 0;
        let snapVelocityTimeoutId = null;

        // --- UI制御（画面の開閉など） ---
        
        calendarArea.addEventListener('click', (e) => {
            if (e.target === calendarArea || e.target.classList.contains('calendar-scroll-wrapper')) {
                document.body.classList.remove('calendar-open');
            }
        });

        backToMonthsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.body.classList.remove('calendar-open');
        });

        toggleViewBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            renderGallery();
            galleryContainer.style.display = 'block';
        });

        galleryCloseBtn.addEventListener('click', () => {
            galleryContainer.style.display = 'none';
        });

        function renderGallery() {
            galleryGrid.innerHTML = '';
            const storageKey = getStorageKey(currentYear, currentMonth);
            const savedPhotos = JSON.parse(localStorage.getItem(storageKey)) || {};
            
            const photoDays = Object.keys(savedPhotos).sort((a,b) => a - b);
            const photoCount = photoDays.length;
            
            let cols = 3; 
            if (photoCount === 0) cols = 1;
            else if (photoCount === 1) cols = 1;
            else if (photoCount <= 4) cols = 2;
            else if (photoCount <= 9) cols = 3;
            else if (photoCount <= 16) cols = 4;
            else if (photoCount <= 25) cols = 5;
            else cols = 6;

            galleryGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            photoDays.forEach(day => {
                const tile = document.createElement('div');
                tile.classList.add('gallery-tile');
                const img = document.createElement('img');
                img.src = savedPhotos[day];
                tile.appendChild(img);
                
                tile.addEventListener('click', () => {
                    collectActiveMonthPhotos();
                    currentPhotoIndex = activeMonthPhotos.findIndex(p => p.day == day);
                    lightboxImage.src = activeMonthPhotos[currentPhotoIndex].src;
                    lightboxDate.textContent = `${currentMonth}.${day}`;
                    lightbox.style.display = 'flex';
                    setTimeout(() => lightbox.classList.add('open'), 10);
                });
                
                galleryGrid.appendChild(tile);
            });
        }

        // --- ロジック（カレンダー・月カード） ---
        
        function createMonthCards() {
            const spacers = scrollContainer.querySelectorAll('.scroll-spacer');
            for (let m = 1; m <= 12; m++) {
                const card = document.createElement('div');
                card.classList.add('month-card');
                card.dataset.month = m;
                if (m === currentMonth) card.classList.add('active');

                const title = document.createElement('div');
                title.classList.add('card-title');
                title.textContent = `${currentYear} . ${String(m).padStart(2, '0')}`;
                card.appendChild(title);

                const img1 = document.createElement('img');
                img1.classList.add('card-slideshow-img');
                const img2 = document.createElement('img');
                img2.classList.add('card-slideshow-img');
                card.appendChild(img1);
                card.appendChild(img2);

                scrollContainer.insertBefore(card, spacers[1]);

                cardObjects.push({
                    month: m,
                    element: card,
                    images: [img1, img2],
                    intervalId: null
                });

                card.addEventListener('click', () => {
                    if (card.classList.contains('active')) {
                        document.body.classList.add('calendar-open');
                        calendarMonthText.textContent = `${currentYear} . ${String(currentMonth).padStart(2, '0')}`;
                        syncCalendarPosition();
                    } else {
                        isSyncingScroll = true;
                        card.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
                        currentMonth = m;
                        applyLayerEffects();
                        updateAllCalendarGrids();
                        setTimeout(() => { isSyncingScroll = false; syncCalendarPosition(); }, 350);
                    }
                });
            }
            setTimeout(applyLayerEffects, 150);
        }

        function startCardSlideshow(cardObj) {
            if (cardObj.intervalId) clearInterval(cardObj.intervalId);
            
            const storageKey = getStorageKey(currentYear, cardObj.month);
            const savedPhotos = JSON.parse(localStorage.getItem(storageKey)) || {};
            const photoUrls = Object.values(savedPhotos);

            const imgElements = cardObj.images;
            
            if (photoUrls.length === 0) {
                imgElements[0].classList.remove('fade-in');
                imgElements[1].classList.remove('fade-in');
                return;
            }

            let photoIdx = 0;
            let activeElementIdx = 0;

            imgElements[activeElementIdx].src = photoUrls[photoIdx];
            imgElements[activeElementIdx].classList.add('fade-in');

            if (photoUrls.length > 1) {
                cardObj.intervalId = setInterval(() => {
                    photoIdx = (photoIdx + 1) % photoUrls.length;
                    const nextElementIdx = 1 - activeElementIdx;

                    imgElements[nextElementIdx].src = photoUrls[photoIdx];
                    imgElements[nextElementIdx].classList.add('fade-in');
                    imgElements[activeElementIdx].classList.remove('fade-in');

                    activeElementIdx = nextElementIdx;
                }, 4000);
            }
        }

        function updateAllSlideshows() {
            cardObjects.forEach(cardObj => startCardSlideshow(cardObj));
        }

        function drawGrid(targetGrid, year, month) {
            targetGrid.innerHTML = '';
            if (month < 1 || month > 12) {
                targetGrid.style.visibility = 'hidden';
                return;
            }
            targetGrid.style.visibility = 'visible';

            const storageKey = getStorageKey(year, month);
            let savedPhotos = JSON.parse(localStorage.getItem(storageKey)) || {};

            const startDayOfWeek = new Date(year, month - 1, 1).getDay();
            const daysInMonth = new Date(year, month, 0).getDate();

            for (let i = 0; i < startDayOfWeek; i++) {
                const blankTile = document.createElement('div');
                blankTile.classList.add('day-tile', 'blank-tile');
                targetGrid.appendChild(blankTile);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const tile = document.createElement('div');
                tile.classList.add('day-tile');
                tile.dataset.day = i;
                
                const numberSpan = document.createElement('span');
                numberSpan.classList.add('day-number');
                numberSpan.textContent = i;
                tile.appendChild(numberSpan);

                if (savedPhotos[i]) {
                    const img = document.createElement('img');
                    img.src = savedPhotos[i];
                    tile.appendChild(img);
                    tile.classList.add('has-image');
                }

                tile.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentSelectedTile = tile;
                    
                    if (tile.classList.contains('has-image')) {
                        collectActiveMonthPhotos();
                        currentPhotoIndex = activeMonthPhotos.findIndex(p => p.day == tile.dataset.day);

                        lightboxImage.src = activeMonthPhotos[currentPhotoIndex].src;
                        lightboxDate.textContent = `${month}.${activeMonthPhotos[currentPhotoIndex].day}`;
                        
                        lightbox.style.display = 'flex';
                        setTimeout(() => {
                            lightbox.classList.add('open');
                        }, 10);
                    } else {
                        fileInput.click();
                    }
                });

                targetGrid.appendChild(tile);
            }

            const totalTiles = startDayOfWeek + daysInMonth;
            const remainTiles = (7 - (totalTiles % 7)) % 7;
            for (let i = 0; i < remainTiles; i++) {
                const blankTile = document.createElement('div');
                blankTile.classList.add('day-tile', 'blank-tile');
                targetGrid.appendChild(blankTile);
            }
        }

        function collectActiveMonthPhotos() {
            activeMonthPhotos = [];
            const tiles = calCurrent.querySelectorAll('.day-tile:not(.blank-tile)');
            tiles.forEach(tile => {
                if (tile.classList.contains('has-image')) {
                    activeMonthPhotos.push({
                        day: tile.dataset.day,
                        src: tile.querySelector('img').src,
                        tileElement: tile
                    });
                }
            });
        }

        function changeLightBoxPhoto(direction) {
            if (activeMonthPhotos.length <= 1) return;

            if (direction === 'next') {
                currentPhotoIndex = (currentPhotoIndex + 1) % activeMonthPhotos.length;
            } else if (direction === 'prev') {
                currentPhotoIndex = (currentPhotoIndex - 1 + activeMonthPhotos.length) % activeMonthPhotos.length;
            }

            lightboxImage.style.opacity = '0';
            setTimeout(() => {
                lightboxImage.src = activeMonthPhotos[currentPhotoIndex].src;
                lightboxDate.textContent = `${currentMonth}.${activeMonthPhotos[currentPhotoIndex].day}`;
                currentSelectedTile = activeMonthPhotos[currentPhotoIndex].tileElement;
                lightboxImage.style.opacity = '1';
            }, 150);
        }

        // --- スワイプとライトボックス操作 ---
        lightboxContainerDOM.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        lightboxContainerDOM.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipeGesture();
        }, {passive: true});

        lightboxContainerDOM.addEventListener('mousedown', (e) => {
            touchStartX = e.screenX;
        });
        lightboxContainerDOM.addEventListener('mouseup', (e) => {
            touchEndX = e.screenX;
            handleSwipeGesture();
        });

        function handleSwipeGesture() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;

            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) changeLightBoxPhoto('next');
                else changeLightBoxPhoto('prev');
            }
        }

        lightboxImage.addEventListener('click', (e) => {
            e.stopPropagation();
            if (galleryContainer.style.display === 'block') {
                return;
            }
            fileInput.click();
        });

        // ライトボックス用の「戻る」ボタン動作
        lightboxCloseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            lightbox.classList.remove('open');
            setTimeout(() => {
                lightbox.style.display = 'none';
            }, 400);
        });

        lightbox.addEventListener('click', () => {
            lightbox.classList.remove('open');
            setTimeout(() => {
                lightbox.style.display = 'none';
            }, 400);
        });

        // --- カレンダーの表示と同期 ---
        function updateAllCalendarGrids() {
            drawGrid(calCurrent, currentYear, currentMonth);
            drawGrid(calPrev, currentYear, currentMonth - 1);
            drawGrid(calNext, currentYear, currentMonth + 1);
        }

        function syncCalendarPosition() {
            // ★変更: 画面幅を正しく計算してカレンダーを中央に寄せる
            const gridMargin = (window.innerWidth - calCurrent.offsetWidth) / 2;
            const targetLeft = calCurrent.offsetLeft - gridMargin;
            calendarWrapper.scrollLeft = targetLeft;
        }

        function applyLayerEffects() {
            if(document.body.classList.contains('calendar-open')) {
                calendarMonthText.textContent = `${currentYear} . ${String(currentMonth).padStart(2, '0')}`;
            }

            cardObjects.forEach((cardObj) => {
                const card = cardObj.element;
                
                if (cardObj.month === currentMonth) {
                    card.classList.add('active');
                    card.style.opacity = "1";
                    card.style.transform = "scale(1) translateY(0)";
                    card.style.zIndex = "10";
                } else {
                    card.classList.remove('active');
                    card.style.opacity = "0.25";
                    card.style.zIndex = "1";

                    if (cardObj.month === currentMonth + 1) {
                        card.style.transform = "scale(0.85) translateY(-20px)";
                    } 
                    else if (cardObj.month === currentMonth - 1) {
                        card.style.transform = "scale(0.85) translateY(20px)";
                    } 
                    else {
                        card.style.transform = "scale(0.85) translateY(0)";
                    }
                }
            });
        }

        scrollContainer.addEventListener('scroll', () => {
            if (isSyncingScroll) return;
            
            if (snapVelocityTimeoutId) clearTimeout(snapVelocityTimeoutId);

            const containerCenter = scrollContainer.scrollTop + scrollContainer.clientHeight / 2;
            let targetCardObj = null;

            cardObjects.forEach((cardObj) => {
                const card = cardObj.element;
                const cardCenter = card.offsetTop + card.clientHeight / 2;
                
                if (Math.abs(containerCenter - cardCenter) < 40) {
                    targetCardObj = cardObj;
                }
            });

            if (targetCardObj && currentMonth !== targetCardObj.month) {
                currentMonth = targetCardObj.month;
                applyLayerEffects();
                updateAllCalendarGrids();
                
                isSyncingScroll = true;
                syncCalendarPosition();
                setTimeout(() => isSyncingScroll = false, 50);
            }

            snapVelocityTimeoutId = setTimeout(() => {
                if (isSyncingScroll) return;
                
                const activeCardObj = cardObjects.find(c => c.month === currentMonth);
                if (activeCardObj) {
                    isSyncingScroll = true;
                    activeCardObj.element.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
                    
                    setTimeout(() => {
                        isSyncingScroll = false;
                        syncCalendarPosition();
                    }, 200);
                }
            }, 40);
        });

        // --- 画像アップロード ---
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file && currentSelectedTile) {
                const day = currentSelectedTile.dataset.day;
                const storageKey = getStorageKey(currentYear, currentMonth);
                let savedPhotos = JSON.parse(localStorage.getItem(storageKey)) || {};

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        const maxDimension = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxDimension) {
                                height *= maxDimension / width;
                                width = maxDimension;
                            }
                        } else {
                            if (height > maxDimension) {
                                width *= maxDimension / height;
                                height = maxDimension;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;

                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

                        const existingImg = currentSelectedTile.querySelector('img');
                        if (existingImg) existingImg.remove();

                        const displayImg = document.createElement('img');
                        displayImg.src = compressedDataUrl;
                        currentSelectedTile.appendChild(displayImg);
                        currentSelectedTile.classList.add('has-image');

                        if (lightbox.classList.contains('open')) {
                            lightboxImage.src = compressedDataUrl;
                            lightboxDate.textContent = `${currentMonth}.${day}`;
                            collectActiveMonthPhotos();
                        }

                        try {
                            savedPhotos[day] = compressedDataUrl;
                            localStorage.setItem(storageKey, JSON.stringify(savedPhotos));
                            
                            const currentCardObj = cardObjects.find(c => c.month === currentMonth);
                            startCardSlideshow(currentCardObj);

                        } catch (error) {
                            alert("保存容量を超えました。");
                            console.error(error);
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
            fileInput.value = '';
        });

        // --- 初期起動 ---
        loadThemeDesign();
        renderThemeList();
        createMonthCards();
        updateAllCalendarGrids();
        updateAllSlideshows();

        window.addEventListener('resize', syncCalendarPosition);

        window.addEventListener('load', () => {
            setTimeout(() => {
                const targetCard = cardObjects.find(c => c.month === currentMonth).element;
                targetCard.scrollIntoView({ block: 'center', inline: 'nearest' });
            }, 100);
        });
    </script>
</body>
